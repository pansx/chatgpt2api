{{- $name := include "c.name" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  {{- if .Values.authKey }}
  auth-key: {{ .Values.authKey | b64enc | quote }}
  {{- else if and $existing $existing.data }}
  auth-key: {{ index $existing.data "auth-key" | quote }}
  {{- else }}
  auth-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- if and $existing $existing.data }}
  solver-key: {{ index $existing.data "solver-key" | quote }}
  {{- else }}
  solver-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}

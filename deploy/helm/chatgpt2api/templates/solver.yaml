apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c.name" . }}-solver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c.name" . }}-solver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "c.name" . }}-solver
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: solver
          image: {{ .Values.solver.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SENTINEL_SOLVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "c.name" . }}
                  key: solver-key
            {{- with (.Values.solver.proxy | default .Values.proxy) }}
            - name: SENTINEL_SOLVER_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.solver.downloadProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local"
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources: {{ toYaml .Values.solver.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /ms-playwright
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "c.name" . }}-solver-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c.name" . }}-solver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "c.name" . }}-solver
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c.name" . }}-solver-data
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.browserSize }}
{{- end }}

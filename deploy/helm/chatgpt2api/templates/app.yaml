apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "c.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: ["sh", "-ec", "mkdir -p /persist/config; test -f /persist/config/config.json || printf '{}' > /persist/config/config.json"]
          volumeMounts:
            - name: storage
              mountPath: /persist
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: CHART_PROXY
              value: {{ .Values.proxy | quote }}
            - name: STORAGE_BACKEND
              value: sqlite
            - name: CHATGPT2API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "c.name" . }}
                  key: auth-key
            - name: CHATGPT2API_SENTINEL_SOLVER_URL
              value: http://{{ include "c.name" . }}-solver:8080
            - name: CHATGPT2API_SENTINEL_SOLVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "c.name" . }}
                  key: solver-key
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /app/.venv/bin/python - <<'PY'
              import json, os
              from pathlib import Path
              p = Path('/app/config.json')
              data = json.loads(p.read_text())
              if os.environ.get('CHART_PROXY'):
                  data['proxy'] = os.environ['CHART_PROXY']
              p.write_text(json.dumps(data))
              PY
              exec /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 80
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/data
            - name: storage
              mountPath: /app/config.json
              subPath: config/config.json
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "c.name" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "c.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c.name" . }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
